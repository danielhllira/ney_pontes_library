default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV['RAILS_MAX_THREADS'] || 5 %>
  url: <%= ENV['DATABASE_URL'] %>

development: &development
  <<: *default
  database: ney_pontes_library_development
  username: postgres
  password: pgpass
  host: 127.0.0.1

production:
  <<: *default